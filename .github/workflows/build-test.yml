name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Release build + ctest (FIX ${{ matrix.fix }})
    # Self-hosted runner on the dev box.  The same toolchain CI used to
    # install via `dnf install` is already on this host: gcc-toolset-15
    # at /opt/rh/gcc-toolset-15, cmake, ninja, tbb-devel, spdlog-devel,
    # boost-devel, lmdb-devel, numactl-devel.  BUILD_PG is OFF because
    # libpqxx is optional.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    env:
      # Activate gcc-toolset-15 the same way the container path did:
      # put its binaries first on PATH, its libs first on LD_LIBRARY_PATH.
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    strategy:
      fail-fast: false
      matrix:
        # Both configurations (#99). FIX ON builds the FIX gateway and runs its
        # tests; FIX OFF catches code that compiles only when FIX is on.
        # FIX ON builds QuickFIX at the server image's ref (#178).
        fix: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4

      - name: Build QuickFIX at the image's ref (cached)
        # FIX ON builds against the QuickFIX the server image ships: QUICKFIX_REF in
        # docker/Dockerfile.oms-server, built by scripts/build-quickfix.sh under the runner's home and
        # rebuilt only when the ref or the compiler changes (#178). CMake searches the
        # CMAKE_PREFIX_PATH environment variable before /usr/local, so the QuickFIX the runner host
        # has installed, which changes outside this repository, isn't used.
        if: matrix.fix == 'ON'
        shell: bash
        run: |
          REF="$(sed -n 's/^ARG QUICKFIX_REF=//p' docker/Dockerfile.oms-server | tr -d '\r')"
          [ -n "$REF" ] || { echo "::error::docker/Dockerfile.oms-server pins no QUICKFIX_REF (#178)"; exit 1; }
          PREFIX="$HOME/.cache/orderprocessor/quickfix-$REF-gcc$(g++ -dumpfullversion)"
          if [ ! -f "$PREFIX/quickfix-ref" ]; then
            rm -rf "${PREFIX:?}"
            scripts/build-quickfix.sh "$REF" "$PREFIX"
          fi
          echo "QuickFIX $(cat "$PREFIX/quickfix-ref"), in $PREFIX"
          echo "QUICKFIX_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$PREFIX" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_FIX=${{ matrix.fix }} \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_APP=ON \
            -DBUILD_PG=OFF

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Check the tests load the pinned QuickFIX
        if: matrix.fix == 'ON'
        shell: bash
        run: |
          ldd build/orderProcessorTest | grep -E 'libquickfix'
          ldd build/orderProcessorTest | grep -qE "libquickfix\.so\.[0-9]+ => $QUICKFIX_PREFIX/" \
            || { echo "orderProcessorTest does not load QuickFIX from $QUICKFIX_PREFIX" >&2; exit 1; }

      - name: Test
        # Tests run in parallel: fixtures that touch the filesystem build
        # per-test-case paths (test::uniqueTestPath), so no two cases share
        # a file or directory.  --timeout turns a hung test into a failure
        # instead of a job that holds the only runner until it is killed
        # (#59); the slowest test takes about 4 s alone.
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 300 -j"$(nproc)"
