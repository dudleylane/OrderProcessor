name: Build & Test

on:
  # Pushes to the two long-lived branches, and pull requests into them: a pull request's branch runs once, for the
  # pull request, and a branch with none runs nothing (#314)
  push:
    branches: [master, feature/fx-swap-support]
  pull_request:
    branches: [master, feature/fx-swap-support]

jobs:
  tested-tree:
    name: Tested tree
    # Records the tree this run tests, and decides whether the jobs below run: the push of a merge skips them when the
    # merged pull request's run of this workflow passed on the same tree (#314). scripts/ci-tested-tree.sh says how it
    # decides; whatever it can't confirm runs them. Skipped for a fork's pull request and for Dependabot, as the jobs
    # below are (#143, #168).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A few API calls: a hung one would hold the only runner until it is killed (#169)
    timeout-minutes: 5
    # Read access to what it compares, and nothing else
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Record the tree, and decide whether the other jobs run
        id: decide
        shell: bash
        env:
          # The job's own token: the runner runs as the maintainer, whose gh login this must never use
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-tested-tree.sh build-test.yml

  build-and-test:
    name: Release build + ctest
    # Self-hosted runner on the dev box.  The same toolchain CI used to
    # install via `dnf install` is already on this host: gcc-toolset-15
    # at /opt/rh/gcc-toolset-15, cmake, ninja, tbb-devel, spdlog-devel,
    # boost-devel, lmdb-devel, numactl-devel.  BUILD_PG is OFF because
    # libpqxx is optional.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung step would hold the only runner for GitHub's six-hour default (#169). The job's last 25 successful runs, on
    # either branch to 2026-10-14, took 7.5 minutes at most; the rest is room for a loaded laptop and for a FetchContent
    # clone on a cold cache.
    timeout-minutes: 45
    env:
      # Activate gcc-toolset-15 the same way the container path did:
      # put its binaries first on PATH, its libs first on LD_LIBRARY_PATH.
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_APP=ON \
            -DBUILD_PG=OFF \
            -DWARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # Tests run in parallel: fixtures that touch the filesystem build
        # per-test-case paths (test::uniqueTestPath), so no two cases share
        # a file or directory.  --timeout turns a hung test into a failure
        # instead of a job that holds the only runner until it is killed
        # (#59); the slowest test takes about 4 s alone.
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 300 -j"$(nproc)"
