name: Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Release build + ctest (FIX ${{ matrix.fix }})
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    strategy:
      fail-fast: false
      matrix:
        # Both configurations (#99). FIX ON builds the FIX gateway and runs its
        # tests; FIX OFF catches code that compiles only when FIX is on.
        # QuickFIX is installed on the runner host (/usr/local/lib).
        fix: ['OFF', 'ON']
    # Activate gcc-toolset-15 by putting its binaries first on PATH and
    # adding its libraries to LD_LIBRARY_PATH.  No `source enable` script
    # exists at the standard path on Stream 10 — env vars achieve the
    # same effect across every step without wrapping each command.
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # FetchContent pulls GoogleTest, Google Benchmark and
        # nlohmann/json at configure time — needs network access (default
        # in GitHub-hosted runners).  Tests, benchmarks, and the
        # WebSocket app are all on so the bulk of the codebase is
        # exercised by the build.
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_APP=ON \
            -DBUILD_PG=OFF \
            -DBUILD_FIX=${{ matrix.fix }}

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # Tests run in parallel: fixtures that touch the filesystem build
        # per-test-case paths (test::uniqueTestPath), so no two cases share
        # a file or directory.  --timeout turns a hung test into a failure
        # instead of a job that holds the only runner until it is killed
        # (#59); the slowest test takes about 4 s alone.
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 300 -j"$(nproc)"
