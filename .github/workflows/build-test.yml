name: Build & Test

on:
  # Pushes to the two long-lived branches, and pull requests into them: a pull request's branch runs once, for the
  # pull request, and a branch with none runs nothing (#314)
  push:
    branches: [master, feature/fx-swap-support]
  pull_request:
    branches: [master, feature/fx-swap-support]

jobs:
  tested-tree:
    name: Tested tree
    # Records the tree this run tests, and decides whether the jobs below run: the push of a merge skips them when the
    # merged pull request's run of this workflow passed on the same tree (#314). scripts/ci-tested-tree.sh says how it
    # decides; whatever it can't confirm runs them. Skipped for a fork's pull request and for Dependabot, as the jobs
    # below are (#143, #168).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A few API calls: a hung one would hold its runner until it is killed (#169)
    timeout-minutes: 5
    # Read access to what it compares, and nothing else
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the tree, and decide whether the other jobs run
        id: decide
        shell: bash
        env:
          # The job's own token: the runner runs as the maintainer, whose gh login this must never use
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-tested-tree.sh build-test.yml

  build-and-test:
    name: Release build + ctest
    # Self-hosted runner on the dev box.  The same toolchain CI used to
    # install via `dnf install` is already on this host: gcc-toolset-15
    # at /opt/rh/gcc-toolset-15, cmake, ninja, tbb-devel, spdlog-devel,
    # boost-devel, lmdb-devel, numactl-devel, and libpqxx-devel 8.0.2 from
    # PostgreSQL's own repository (PGDG), for BUILD_PG (#151).
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung step would hold its runner for GitHub's six-hour default (#169). The job's last 25 successful runs, on
    # either branch to 2026-10-14, took 7.5 minutes at most; the rest is room for a loaded laptop and for a FetchContent
    # clone on a cold cache.
    timeout-minutes: 45
    env:
      # Activate gcc-toolset-15 the same way the container path did:
      # put its binaries first on PATH, its libs first on LD_LIBRARY_PATH.
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # A link's LTRANS jobs take the job's share of the host's threads, as its build and its tests do (#738)
        shell: bash
        run: |
          jobs=$(scripts/ci-jobs.sh)
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_APP=ON \
            -DBUILD_PG=ON \
            -DWARNINGS_AS_ERRORS=ON \
            -DLTO_JOBS="$jobs"

      - name: Build
        # With the job's share of the host's threads (#738): the runners run their jobs at once, and builds that each
        # took every thread held the runners' slice over its memory limit until GitHub gave their jobs up (#740).
        # scripts/ci-jobs.sh takes the share from CI_BUILD_JOBS, which each runner's .env gives.
        # Under scripts/memory-cap.sh's 8G cap, in the jobs' slice that MEMORY_CAP_SLICE in the runner's .env names,
        # outside the runners' own slice (#740): a build that runs away is killed and named there, and doesn't stall
        # the runners. 8G holds asan_ubsan's 5.5 GiB at a share of 2, with room; measure again for another share.
        shell: bash
        run: |
          jobs=$(scripts/ci-jobs.sh)
          scripts/memory-cap.sh 8G cmake --build build -j"$jobs"

      - name: Test
        # Tests run in parallel: fixtures that touch the filesystem build
        # per-test-case paths (test::uniqueTestPath), so no two cases share
        # a file or directory.  --timeout turns a hung test into a failure
        # instead of a job that holds its runner until it is killed
        # (#59); the slowest test takes about 4 s alone.  Under a 4G
        # memory cap (#607): a test that runs away is killed at the cap
        # and named, and the rest run, before it can take down the
        # laptop the runners share.  The larger suite, FX's with the
        # gateway, peaks at about 0.5 GiB here.  As many run at once as
        # the job's share of the host's threads, as in its build (#738).
        shell: bash
        run: |
          jobs=$(scripts/ci-jobs.sh)
          scripts/memory-cap.sh 4G ctest --test-dir build --output-on-failure --timeout 300 -j"$jobs"

      - name: Postgres write-behind tests, against a throwaway database
        # The step above built these and skipped them, for want of a database (#151). This starts one with the schema,
        # in a container on a loopback port, and leaves the host's own PostgreSQL alone. It is named for this runner:
        # another runner's job may have a database of its own up at the same time (#736).
        shell: bash
        run: |
          pg="$(scripts/ci-names.sh prefix)pg-release"
          trap 'scripts/pg-for-tests.sh stop "$pg"' EXIT
          PG_CONNECTION_STRING="$(scripts/pg-for-tests.sh start "$pg")"
          export PG_CONNECTION_STRING
          # Under the Test step's memory cap (#607); the database's container stays outside it
          scripts/memory-cap.sh 4G ctest --test-dir build --output-on-failure --timeout 300 --no-tests=error \
            -R 'PGWriteBehind|Postgres' | tee "$RUNNER_TEMP/pg-tests.log"
          # A test that found no database skipped, and ctest counts a skip as a pass
          if grep -q '(Skipped)' "$RUNNER_TEMP/pg-tests.log"; then
            echo "::error::a Postgres test skipped: PG_CONNECTION_STRING didn't reach it"
            exit 1
          fi
