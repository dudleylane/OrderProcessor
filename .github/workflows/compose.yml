name: Compose Stack

# A run takes about three minutes of a runner, most of it building both images, which docker.yml's jobs build
# for every pull request anyway. So this runs when what only it covers changes, and weekly, for new base images (#140).
on:
  # Pushes to the two long-lived branches, and pull requests into them: a pull request's branch runs once, for the
  # pull request, and a branch with none runs nothing (#314)
  push:
    branches: [master, feature/fx-swap-support]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'scripts/check-compose-stack.sh'
      - '.github/workflows/compose.yml'
  pull_request:
    branches: [master, feature/fx-swap-support]
    paths:
      - 'docker/**'
      - '.dockerignore'
      - 'scripts/check-compose-stack.sh'
      - '.github/workflows/compose.yml'
  schedule:
    # Mondays at 06:17 UTC. A scheduled run uses master's workflow file and checks master.
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  tested-tree:
    name: Tested tree
    # Records the tree this run tests, and decides whether the jobs below run: the push of a merge skips them when the
    # merged pull request's run of this workflow passed on the same tree (#314). scripts/ci-tested-tree.sh says how it
    # decides; whatever it can't confirm runs them. Skipped for a fork's pull request and for Dependabot, as the jobs
    # below are (#143, #168).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A few API calls: a hung one would hold its runner until it is killed (#169)
    timeout-minutes: 5
    # Read access to what it compares, and nothing else
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the tree, and decide whether the other jobs run
        id: decide
        shell: bash
        env:
          # The job's own token: the runner runs as the maintainer, whose gh login this must never use
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-tested-tree.sh compose.yml

  compose-stack:
    name: Compose stack up + order
    # Brings up docker/docker-compose.yml's stack, Postgres, the server and the
    # nginx frontend, and checks that they work together (#140).  The image
    # checks in docker.yml run each image alone.
    # scripts/check-compose-stack.sh says what it checks; run it locally the
    # same way.  Like the image checks, it names what it makes after this
    # runner and the run (#736) and removes it.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung build or start would hold its runner until it is killed (#59).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Remove what an earlier job of this runner left behind
        # As in docker.yml: the host has powered off mid-job (#32), and a
        # runner runs one job at a time, so whatever bears this runner's
        # prefix belongs to an earlier job of its own (#736).  podman-compose
        # also makes a pod, named pod_<project>, which scripts/ci-names.sh
        # removes too.
        shell: bash
        run: scripts/ci-names.sh remove

      - name: Bring up the compose stack and check it
        shell: bash
        # Named for this runner and this run (#736)
        run: |
          CHECK_NAME="$(scripts/ci-names.sh prefix)$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-stack"
          export CHECK_NAME
          scripts/check-compose-stack.sh
