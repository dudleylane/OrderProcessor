name: Format Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  clang-format:
    name: clang-format dry-run
    # Self-hosted runner on the dev box.  No centos:stream10 container
    # needed — clang-format-22 is already installed on the host (same
    # version CI used to install via `dnf install -y clang-tools-extra`).
    # Called by its versioned name because this job inherits the runner's
    # PATH: an unversioned clang-format earlier on it (pip installs 23.x
    # into ~/.local/bin) would win, and 23.1.0 flags master as unformatted.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung step would hold the only runner for GitHub's six-hour default (#169). The job's last 25 successful runs, on
    # either branch to 2026-10-14, took 2.3 minutes at most.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify .clang-format conformance
        shell: bash
        run: |
          find src test app bench \
               \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-22 --dry-run -Werror
