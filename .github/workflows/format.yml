name: Format Check

on:
  # Pushes to the two long-lived branches, and pull requests into them: a pull request's branch runs once, for the
  # pull request, and a branch with none runs nothing (#314)
  push:
    branches: [master, feature/fx-swap-support]
  pull_request:
    branches: [master, feature/fx-swap-support]

jobs:
  tested-tree:
    name: Tested tree
    # Records the tree this run tests, and decides whether the jobs below run: the push of a merge skips them when the
    # merged pull request's run of this workflow passed on the same tree (#314). scripts/ci-tested-tree.sh says how it
    # decides; whatever it can't confirm runs them. Skipped for a fork's pull request and for Dependabot, as the jobs
    # below are (#143, #168).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A few API calls: a hung one would hold the only runner until it is killed (#169)
    timeout-minutes: 5
    # Read access to what it compares, and nothing else
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Record the tree, and decide whether the other jobs run
        id: decide
        shell: bash
        env:
          # The job's own token: the runner runs as the maintainer, whose gh login this must never use
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-tested-tree.sh format.yml

  clang-format:
    name: clang-format dry-run
    # Self-hosted runner on the dev box.  No centos:stream10 container
    # needed — clang-format-22 is already installed on the host (same
    # version CI used to install via `dnf install -y clang-tools-extra`).
    # Called by its versioned name because this job inherits the runner's
    # PATH: an unversioned clang-format earlier on it (pip installs 23.x
    # into ~/.local/bin) would win, and 23.1.0 flags master as unformatted.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung step would hold the only runner for GitHub's six-hour default (#169). The job's last 25 successful runs, on
    # either branch to 2026-10-14, took 2.3 minutes at most.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify .clang-format conformance
        shell: bash
        run: |
          find src test app bench \
               \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-22 --dry-run -Werror

  lint:
    name: shellcheck, actionlint, hadolint
    # scripts/lint.sh (#174): each linter from its official image, pinned by
    # digest, over a read-only copy of the tracked files, with no network.
    # The first run pulls the images; later runs use the copies in the
    # podman store this user shares.  A tool changes only when someone
    # changes its digest in the script.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung pull would hold the only runner until it is killed (#59).  A run
    # takes seconds once the images are in the store.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint the shell scripts, the workflows and the Dockerfiles
        shell: bash
        run: scripts/lint.sh
