name: Sanitizers

on:
  # Pushes to the two long-lived branches, and pull requests into them: a pull request's branch runs once, for the
  # pull request, and a branch with none runs nothing (#314)
  push:
    branches: [master, feature/fx-swap-support]
  pull_request:
    branches: [master, feature/fx-swap-support]

jobs:
  tested-tree:
    name: Tested tree
    # Records the tree this run tests, and decides whether the jobs below run: the push of a merge skips them when the
    # merged pull request's run of this workflow passed on the same tree (#314). scripts/ci-tested-tree.sh says how it
    # decides; whatever it can't confirm runs them. Skipped for a fork's pull request and for Dependabot, as the jobs
    # below are (#143, #168).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A few API calls: a hung one would hold the only runner until it is killed (#169)
    timeout-minutes: 5
    # Read access to what it compares, and nothing else
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the tree, and decide whether the other jobs run
        id: decide
        shell: bash
        env:
          # The job's own token: the runner runs as the maintainer, whose gh login this must never use
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-tested-tree.sh sanitizers.yml

  sanitizer:
    name: ${{ matrix.sanitizer }}${{ matrix.allow_failure && ' (advisory)' || '' }}
    # Self-hosted runner on the dev box.  The toolchain CI used to
    # install via `dnf install -y gcc-toolset-15* tbb-devel ...` is
    # already on this host (verified before the migration).  Matrix
    # jobs serialise on a single self-hosted runner — they'll run
    # sequentially rather than in parallel, so total wall-clock is the
    # sum (asan_ubsan + tsan) rather than the max.  Acceptable trade
    # for the budget.
    # Skip a fork's pull request: this self-hosted runner is the maintainer's laptop (#143).
    # A pull request can delete this line, so the runner's job-started hook,
    # scripts/runner/job-started.sh, refuses such a job as well. Pushes and
    # same-repository pull requests run as before.
    # Dependabot's jobs are refused by the same hook, and skipped here (#168): its pull requests are checked locally.
    # Skipped on the push of a merge when the merged pull request's run of this workflow passed on the same tree: only
    # a tested-tree job that succeeded and found that run skips it (#314).
    needs: tested-tree
    if: >-
      !cancelled() && (needs.tested-tree.result != 'success' || needs.tested-tree.outputs.run != 'false')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, orderprocessor-dev]
    # A hung step would hold the only runner for GitHub's six-hour default (#169). The jobs' last 25 successful runs, on
    # either branch to 2026-10-14, took 11.3 minutes at most; the rest is room for a loaded laptop and for building the
    # instrumented oneTBB on a cold cache.
    timeout-minutes: 60
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        # ASan and TSan are mutually exclusive (per CLAUDE.md
        # §Sanitizer Builds); UBSan composes with ASan.  Bundling
        # ASan+UBSan into one job halves the matrix runtime versus
        # running them separately.  TSan gets its own job.
        #
        # OrderProcessor has no first-class CMake sanitizer flag (yet),
        # so flags are passed via CMAKE_CXX_FLAGS — exactly the recipe
        # documented in CLAUDE.md.
        include:
          - sanitizer: asan_ubsan
            cxxflags: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            ldflags: "-fsanitize=address,undefined"
            allow_failure: false
            # This job also builds the benchmarks and the fuzz target (#155): it runs every benchmark once, and ctest
            # replays the fuzz corpus. Nothing else in CI runs either; BM_TaskManagerThroughput aborted in every Debug
            # build for weeks before anyone noticed (#125).
            extras: "ON"
          # TSan runs against a TSan-instrumented oneTBB (built below),
          # because the system libtbb is not instrumented: TSan could not
          # see the task scheduler's handoffs and reported every task
          # hand-over as a race (320 reports at 60 sites locally).  With
          # it instrumented, what remains is real.
          #
          # Gating since #13: the two races the instrumented job found are
          # fixed (order publication, aeeafa5; TaskManager lifetime,
          # 726039d), and the suite is clean under this job's settings.
          # A report here is a real race until proven otherwise, reasoned
          # from source -- do not make this advisory again, and do not add
          # a suppression for tbb:: frames: that would also hide races
          # under TBB locks.  If this job goes red and the cause is not
          # obvious, check the "Check the tests load the instrumented
          # oneTBB" step first.
          - sanitizer: tsan
            cxxflags: "-fsanitize=thread -fno-omit-frame-pointer -g"
            ldflags: "-fsanitize=thread"
            allow_failure: false
            extras: "OFF"
    env:
      PATH: /opt/rh/gcc-toolset-15/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/rh/gcc-toolset-15/root/usr/lib64
      CC: /opt/rh/gcc-toolset-15/root/usr/bin/gcc
      CXX: /opt/rh/gcc-toolset-15/root/usr/bin/g++
    steps:
      - uses: actions/checkout@v4

      - name: Build TSan-instrumented oneTBB (cached)
        # Same oneTBB version as the system tbb-devel, built with
        # -fsanitize=thread by the job's compiler and installed under the
        # runner's home.  Rebuilt only when the version or compiler changes.
        # The version is pinned, and the job fails when tbb-devel moves
        # (#176): the TSan job would otherwise test a oneTBB the Release
        # builds don't link.  Follow an update by changing TBB_VERSION, which
        # fetches and builds the new tag here only once a person has asked.
        if: matrix.sanitizer == 'tsan'
        shell: bash
        run: |
          TBB_VERSION=v2021.11.0
          SYSTEM_TBB="v$(rpm -q --qf '%{VERSION}' tbb-devel)" || {
            echo "::error::tbb-devel isn't installed, so there is no oneTBB version to match (#176)"
            exit 1
          }
          if [ "$SYSTEM_TBB" != "$TBB_VERSION" ]; then
            echo "::error::the system's tbb-devel is $SYSTEM_TBB, but this job builds oneTBB $TBB_VERSION for TSan (#176)"
            exit 1
          fi
          PREFIX="$HOME/.cache/orderprocessor/onetbb-$TBB_VERSION-tsan-gcc$(g++ -dumpfullversion)"
          if [ ! -f "$PREFIX/lib64/cmake/TBB/TBBConfig.cmake" ]; then
            SRC=$(mktemp -d)
            git clone -q --depth 1 --branch "$TBB_VERSION" https://github.com/uxlfoundation/oneTBB.git "$SRC"
            cmake -S "$SRC" -B "$SRC/build" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DTBB_SANITIZE=thread -DTBB_TEST=OFF -DTBB_EXAMPLES=OFF -DTBB_STRICT=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX"
            cmake --build "$SRC/build" -j"$(nproc)"
            cmake --install "$SRC/build"
            rm -rf "$SRC"
          fi
          echo "TBB_TSAN_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Configure
        # Debug build keeps assertions on so invariant violations fire
        # under sanitizers.  CMAKE_EXE_LINKER_FLAGS and
        # CMAKE_SHARED_LINKER_FLAGS get the runtime libs onto the link
        # line — required for TSan in particular, which needs
        # libtsan.so present.
        shell: bash
        run: |
          TBB_PREFIX_ARG=()
          if [ -n "${TBB_TSAN_PREFIX:-}" ]; then
            TBB_PREFIX_ARG=(-DCMAKE_PREFIX_PATH="$TBB_TSAN_PREFIX")
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=${{ matrix.extras }} \
            -DBUILD_FUZZ=${{ matrix.extras }} \
            -DBUILD_APP=ON \
            -DBUILD_PG=ON \
            "${TBB_PREFIX_ARG[@]}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.ldflags }}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.ldflags }}"

      - name: Build
        shell: bash
        run: cmake --build build -j"$(nproc)"

      - name: Check the tests load the instrumented oneTBB
        # The instrumented library is libtbb_debug.so.12; if the binary
        # resolved the system libtbb.so.12 instead, TSan would silently be
        # blind to the scheduler again.
        if: matrix.sanitizer == 'tsan'
        shell: bash
        run: |
          ldd build/orderProcessorTest | grep -E 'libtbb'
          ldd build/orderProcessorTest | grep -q "libtbb_debug.so.12 => $TBB_TSAN_PREFIX/" \
            || { echo "orderProcessorTest does not load the instrumented oneTBB from $TBB_TSAN_PREFIX" >&2; exit 1; }

      - name: Test
        # -j1: sanitizer runs are 5-15x slower and memory-hungry, and a
        # serial run keeps each report attributable to one test.  The
        # test isolation that once forced -j1 here is fixed (#10), so
        # this is a sanitizer-specific choice now.  --timeout 600
        # accommodates the slowdown.
        shell: bash
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: ctest --test-dir build --output-on-failure --timeout 600 -j1

      - name: Postgres write-behind tests, against a throwaway database
        # As build-test.yml runs them (#151), here under the sanitizer: the writer is the code that runs a thread of its
        # own, and libpqxx's calls, uninstrumented, stay on it
        shell: bash
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1"
        run: |
          trap 'scripts/pg-for-tests.sh stop orderprocessor-ci-pg-${{ matrix.sanitizer }}' EXIT
          PG_CONNECTION_STRING="$(scripts/pg-for-tests.sh start orderprocessor-ci-pg-${{ matrix.sanitizer }})"
          export PG_CONNECTION_STRING
          ctest --test-dir build --output-on-failure --timeout 600 -j1 --no-tests=error -R 'PGWriteBehind|Postgres' \
            | tee "$RUNNER_TEMP/pg-tests.log"
          # A test that found no database skipped, and ctest counts a skip as a pass
          if grep -q '(Skipped)' "$RUNNER_TEMP/pg-tests.log"; then
            echo "::error::a Postgres test skipped: PG_CONNECTION_STRING didn't reach it"
            exit 1
          fi

      - name: Benchmark smoke run
        # Every benchmark once (#155), to show they run at all: not a timing, which #12 ruled out gating on. The
        # binary exits 0 even when a benchmark fails with SkipWithError, so the step reads the JSON report for
        # errors. In a scratch directory, so the exchange.log the benchmarks write stays out of the checkout.
        if: matrix.extras == 'ON'
        shell: bash
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf -- "${scratch:?}"' EXIT
          cd "$scratch"
          "$GITHUB_WORKSPACE/build/orderProcessorBench" --benchmark_min_time=1x \
            --benchmark_out=smoke.json --benchmark_out_format=json
          python3 -I - smoke.json <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          ran = [b for b in report["benchmarks"] if b.get("run_type") != "aggregate"]
          failed = [b for b in ran if b.get("error_occurred")]
          for b in failed:
              print(f"{b['name']}: {b.get('error_message', 'error')}")
          print(f"{len(ran)} benchmarks ran, {len(failed)} failed")
          sys.exit(1 if failed or not ran else 0)
          PY
