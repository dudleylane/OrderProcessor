[DEFAULT]
ConnectionType=acceptor
# The server's side of every session. The counterparties come from the credentials file, --fix-credentials: a session for
# each, with its CompID as TargetCompID (#147). This file used to fix one, CLIENT_A, in the image, and nothing checked who
# logged on as it.
# FIX 5.0 SP2 over FIXT.1.1 (#377): FIX 4.4 has no ExecType L, Triggered or Activated by System, which a stop's
# release is reported as (#236). A counterparty logs on with DefaultApplVerID (1137) 9, FIX 5.0 SP2's ApplVerID, and the
# gateway refuses any other version: QuickFIX would check that version's messages against no dictionary at all.
BeginString=FIXT.1.1
DefaultApplVerID=FIX.5.0SP2
SenderCompID=ORDER_PROCESSOR
SocketAcceptPort=5001
FileStorePath=/data/fix-store
FileLogPath=/data/fix-log
# Each log file rotates at FileLogMaxMB, and keeps FileLogBackups older ones: a session's two logs take at most
# 2 x 64 MiB x 10 of the data volume, which LMDB shares (#160). QuickFIX's own FileLog grew without limit.
FileLogMaxMB=64
FileLogBackups=9
# FIXT.1.1's session messages, and FIX 5.0 SP2's application messages: QuickFIX's own dictionaries, as the pinned
# release has them (docs/QUICKFIX_DEPENDENCY.md). A FIXT session reads only these two; DataDictionary is for FIX 4.x.
TransportDataDictionary=/etc/orderprocessor/spec/FIXT11.xml
AppDataDictionary=/etc/orderprocessor/spec/FIX50SP2.xml
# One session a day, 17:00 to 16:59:59 New York time: the business day, which ends at 17:00 there (#240). At 17:00
# QuickFIX starts a new one, from sequence number 1. UseLocalTime reads the two times in the process's local time,
# which the server keeps New York's, since QuickFIX has no zone setting. A StartTime equal to the EndTime would roll
# the session at local midnight instead: QuickFIX compares such a session's dates. It rolled at 00:00 UTC (#160).
UseLocalTime=Y
StartTime=17:00:00
EndTime=16:59:59
HeartBtInt=30
SocketNodelay=Y
# A client that reconnects within the day keeps its sequence numbers, so a ResendRequest gets back what was sent while
# it was away, from FileStorePath. With Y, both sides started again from 1 at every logon, and that was lost (#160).
ResetOnLogon=N
