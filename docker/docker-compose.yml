services:
  # ------------------------------------------------------------------
  # OMS Database (PostgreSQL)
  # ------------------------------------------------------------------
  oms-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    # No host port (#146): services reach it as oms-db:5432 on the stack's network, and the host through
    # `docker compose exec oms-db psql`
    volumes:
      - oms-pgdata:/var/lib/postgresql/data
      # z: on an SELinux host, relabel the scripts so a container may read them (#201). Without it Postgres can't list
      # them, exits, and restarts forever, and nothing else starts. It does nothing on a host without SELinux.
      - ./init-db:/docker-entrypoint-initdb.d:ro,z
    # Limits, to tune for the host (#158)
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oms} -d ${POSTGRES_DB:-oms}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------
  # OMS Frontend (React + nginx)
  # ------------------------------------------------------------------
  oms-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.oms-frontend
    restart: unless-stopped
    # The stack's only published port (#146): the app, and /ws, which nginx passes on to the server
    ports:
      - "3000:3000"
    mem_limit: 128m
    pids_limit: 64
    # The image's health check, repeated: podman builds OCI images by default, and they don't keep one (#158)
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "--max-time", "2", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # The server is healthy once it answers on 8080, which it does only after restoring its data (#158)
    depends_on:
      oms-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # OMS Server (C++ OrderProcessor engine + WebSocket)
  # ------------------------------------------------------------------
  oms-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.oms-server
    # Seeds the data volume if it has no instrument yet, then runs the server (#161). A server with nothing seeded refused
    # every order. --if-empty leaves a volume with instruments alone, since what seedData adds is test data; it does seed
    # one a server ran on before it was seeded, which has an LMDB file but no instrument. Not a one-shot service:
    # podman-compose makes a dependency a container that must be running when the server starts.
    entrypoint: ["sh", "-c", "seedData --if-empty --data-dir /data && exec orderProcessorServer \"$$@\"", "oms-server"]
    # The image's CMD, repeated: an entrypoint set here clears it
    command: ["--port", "8080", "--data-dir", "/data"]
    restart: unless-stopped
    # A small init runs as PID 1 and starts the server (#203). As PID 1 itself, the server ignored SIGTERM until its
    # handler was set, after the data directory's restore, and an abort became a SIGSEGV.
    init: true
    # No host port (#146): clients reach the server through the frontend's /ws. A client must offer this access token,
    # which the app asks for; set it in .env (`openssl rand -hex 32` makes one), or compose refuses to start. A browser
    # page must also come from one of OMS_ALLOWED_ORIGINS, comma-separated, when it's set.
    environment:
      OMS_WS_TOKEN: "${OMS_WS_TOKEN:?set OMS_WS_TOKEN in docker/.env, as docker/README.md says}"
      OMS_ALLOWED_ORIGINS: "${OMS_ALLOWED_ORIGINS:-}"
    # Room for a large book and LMDB's map; raise it with them (#158)
    mem_limit: 2g
    pids_limit: 512
    # The image's health check, repeated: podman builds OCI images by default, and they don't keep one (#158). It asks for
    # an HTTP answer, since a server that has stopped accepting still completes TCP handshakes (#202).
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "2", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    volumes:
      - oms-data:/data
    # The server logs to standard output (EXCHANGE_LOG=- in its image, #156); keep at most 3 files of 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      oms-db:
        condition: service_healthy

volumes:
  oms-pgdata:
  oms-data:
