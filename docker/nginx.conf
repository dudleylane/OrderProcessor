# A template: the nginx image's entrypoint renders it into conf.d, with ${NGINX_LOCAL_RESOLVERS} set to the container's
# own DNS resolver (#158), and ${OMS_HSTS} (#226) and ${OMS_PUBLIC_HOST} (#564) from the environment
server {
    # TLS only (#226): every WebSocket upgrade carries the access token. nginx answers a plain HTTP request to this port
    # with its 497, which this turns into a redirect to the same URL over https.
    listen 3000 ssl;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The redirect names the host and port the deployment gives in OMS_PUBLIC_HOST, not the client's Host header, which
    # it used to repeat as given (#564)
    error_page 497 =301 https://${OMS_PUBLIC_HOST}$request_uri;
    # No version in the Server header or on error pages (#564)
    server_tokens off;
    # Strict-Transport-Security, when OMS_HSTS gives its value, such as max-age=31536000. Empty, the default, sends none:
    # set it only with a certificate browsers trust, since one that has seen it refuses the site over any other.
    add_header Strict-Transport-Security "${OMS_HSTS}" always;
    # What a browser may load here, and who may frame it (#564). The app is Vite's build, self-contained, and opens /ws on
    # its own origin: connect-src names that socket, wss://OMS_PUBLIC_HOST, as well as 'self', which covers wss: only in
    # CSP Level 3. Every location inherits these, since none adds its own header.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://${OMS_PUBLIC_HOST}; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # The server's address is looked up when a request needs it, not once at startup (#158). nginx used to exit if the
    # server wasn't up yet, and kept a re-created server container's old address.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # PostgreSQL is available within the Docker network at oms-db:5432

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        set $oms_server oms-server:8080;
        proxy_pass http://$oms_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
