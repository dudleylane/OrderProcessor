# A template: the nginx image's entrypoint renders it into conf.d, with ${NGINX_LOCAL_RESOLVERS} set to the container's
# own DNS resolver (#158), and ${OMS_HSTS} from the environment (#226)
server {
    # TLS only (#226): every WebSocket upgrade carries the access token. nginx answers a plain HTTP request to this port
    # with its 497, which this turns into a redirect to the same URL over https.
    listen 3000 ssl;
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 =301 https://$http_host$request_uri;
    # Strict-Transport-Security, when OMS_HSTS gives its value, such as max-age=31536000. Empty, the default, sends none:
    # set it only with a certificate browsers trust, since one that has seen it refuses the site over any other.
    add_header Strict-Transport-Security "${OMS_HSTS}" always;

    root /usr/share/nginx/html;
    index index.html;

    # The server's address is looked up when a request needs it, not once at startup (#158). nginx used to exit if the
    # server wasn't up yet, and kept a re-created server container's old address.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # PostgreSQL is available within the Docker network at oms-db:5432

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws {
        set $oms_server oms-server:8080;
        proxy_pass http://$oms_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
